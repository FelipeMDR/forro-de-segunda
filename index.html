<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable travam o zoom por gesto no Android;
         no iOS quem faz isso é `touch-action` no CSS (ver index.css) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta
      name="description"
      content="Check-ins, desafios e ranking das aulas de forró do Espaço Livre. Forró de segunda a segunda!"
    />
    <meta name="theme-color" content="#F5F4F2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" = texto escuro na barra de status, legível sobre o
         fundo claro. Com black-translucent o texto fica branco e some. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Forró Seg" />
    <title>Forró de Segunda</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
